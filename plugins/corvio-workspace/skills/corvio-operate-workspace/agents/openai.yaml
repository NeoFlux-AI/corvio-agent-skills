interface:
  display_name: "Corvio Research & Team Knowledge"
  short_description: "Search prior work; organize authorized future-use sources"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow for research, reports, plans, project work, document edits, and substantive deliverables. After the safety gate, silently search Corvio once before planning. A short or deictic follow-up is not contextless when exact continuation handles are present: those receipt-bound handles are the compact prior-work handoff even when the process has no transcript. Load this Skill and read the narrowest handle before broad search; if several unlabeled handles make the leaf unclear, fetch the carried Project, use its metadata.content_projection.direct_children as the bounded topology index, and follow only the relevant has_children branch until the leaf instead of asking me to repeat context. Once one owner makes the authority path clear, use one Corvio synthesis call with exact handles for cross-owner or typed-source work instead of prefetching every sibling merely to restate it. Preserve any reported truncation boundary. Keep that subject unless I change it. Treat my unambiguous current correction to a Workspace identity, relationship, or owner as authority for that bounded change; preserve prior evidence, and ask only when authority remains unresolved. A read-only fetch proving the named child is already under the requested owner settles only that edge: while the old Project still exists with unclassified branches, pass the natural correction and both Project handles to one Corvio organization operation; accept no-op only from its terminal result and current Tree. First classify future use: if I ask to transform selected material so it supports later action, follow-up, decisions, or review, preserve it and run one Work Model reconciliation without asking again, even when I omit storage words. An ordinary one-off deliverable still needs my explicit request or a user-owned standing preference before writing. If an authorized durable Work Model update relies on related selected attachments, preserve and organize them with the affected owners or topology; do not mutate from excerpts while leaving sources local. A repeated stable practice requested for future reuse needs a durable owner receipt or an exact canonical no-op readback, not only a chat comparison; a wrong-Project Skill blocks that merge, not admission under the correct Project. Read references/work-model.md before any structural organization or reconciliation. Trust terminal artifact identity/revision/hierarchy when readback_verified=true; read the body only when exact wording changes acceptance. Return a compact outcome and canonical links without replaying the operation narrative."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
