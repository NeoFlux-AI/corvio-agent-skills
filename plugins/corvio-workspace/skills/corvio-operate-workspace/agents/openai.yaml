interface:
  display_name: "Corvio Team Knowledge"
  short_description: "Find prior work and preserve reusable results"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow for any research, report, comparison, proposal, plan, decision, review, project/debug task, document edit, or substantive deliverable, even without prior material or a Corvio mention. After the safety gate, read Corvio once before planning, continue normally if nothing helps, and preserve substantive authorized results with terminal readback and a canonical reader link."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
