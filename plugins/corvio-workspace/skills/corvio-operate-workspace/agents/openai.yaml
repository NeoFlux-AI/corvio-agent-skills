interface:
  display_name: "Corvio Research & Team Knowledge"
  short_description: "Search prior work; organize authorized future-use sources"
  default_prompt: >-
    Use $corvio-operate-workspace alongside my normal workflow for research, reports, plans, project work, document edits, and substantive deliverables.
    After the safety gate, silently search Corvio once before planning. Exact continuation handles are the compact prior-work handoff even when this process has no transcript: read the narrowest handle before broad search, use a carried Project's bounded direct-child projection only when the leaf is unclear, and preserve truncation boundaries.
    Keep the user's natural goal and proven handles; do not invent Corvio's taxonomy, titles, artifact count, Memory leaf, Skill title, or internal plan. Treat unambiguous current corrections as authority for the bounded relationship while preserving prior evidence and asking only when authority remains unresolved.
    First classify future use. Selected material intended for later action, follow-up, decisions, or review authorizes retention and one Work Model reconciliation even without storage words; ordinary artifact retention still needs explicit or standing authority.
    Original local files remain Assets. If current-turn Markdown composed in this Host should support future work but its owner, lifecycle, Work Model structure, Memory, or Skill outcome remains semantic, pass it once as inline_materials to one authorized ask_corvio call before any durable write. A mixed packet of finalized original Assets plus Host Markdown belongs in that same semantic Question; do not split it across organize_files and a later cleanup. Use direct Page create/update only when the body, carrier, and owner are already decision-ready.
    Treat durable learning as part of each coherent work module: review substantive preference, role/context, active-goal, collaboration, Workspace-operation, and reusable-procedure evidence while fresh. One-off means only a greeting, context-free transient lookup, or explicit local/no-record boundary. Use one semantic operation when the document and learning packets are decision-ready together; otherwise continue from the exact terminal receipt. Let Corvio route personal/Team Memory and Project Skills, then consume execution.durable_learning instead of relying on a final transcript rescan.
    When a Question returns needs_user_input, relay its typed questions and choices through the host's native user-input surface without choosing or rewriting the decision, then submit the user's selections to resume the same Question.
    Read references/work-model.md before structural reconciliation. Trust terminal artifact identity, revision, and hierarchy when readback_verified=true; read the body only when exact wording changes acceptance. Return a compact outcome and canonical links without replaying the operation narrative.
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
