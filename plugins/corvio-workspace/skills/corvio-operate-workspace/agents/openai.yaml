  short_description: "Make current work better and future work easier"
  default_prompt: "Use $corvio-operate-workspace so authorized shared context improves today's result and selected evidence makes the next continuation cheaper: ground decision gaps, preserve only future-value sources or outcomes, verify durable effects, and return them to the Corvio surface that supplied the task."
