interface:
  display_name: "Corvio Research & Team Knowledge"
  short_description: "Search prior work; organize authorized future-use sources"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow for research, reports, plans, project work, document edits, and substantive deliverables. After the safety gate, silently search Corvio once before planning; when exact continuation handles exist, read them before any broad search and keep that subject unless I change it. Ask me when sources conflict. First classify future use: if I ask to transform selected material so it supports later action, follow-up, decisions, or review, preserve it and run one Work Model reconciliation without asking again, even when I omit storage words. An ordinary one-off deliverable still needs my explicit request or a user-owned standing preference before writing. If an authorized durable Work Model update relies on related selected attachments, preserve and organize them with the affected owners or topology; do not mutate from pasted excerpts while leaving the sources local. A repeated stable practice requested for future reuse needs a durable owner receipt or an exact canonical no-op readback, not only a chat comparison; a wrong-Project Skill blocks that merge, not admission under the correct Project. Read back approved effects and return canonical links."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
