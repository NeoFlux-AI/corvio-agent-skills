interface:
  display_name: "Corvio Research & Team Knowledge"
  short_description: "Search prior work; organize authorized future-use sources"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow for research, reports, plans, project work, document edits, and substantive deliverables. After the safety gate, silently search Corvio once before planning. A short or deictic follow-up is not contextless when exact continuation handles are present: those receipt-bound handles are the compact prior-work handoff even when the process has no transcript. Load this Skill and read the narrowest handle with fetch or read_document before any Workspace search or action when the receipt lacks current content; never search to rediscover an exact carried owner; multiple handles alone do not justify semantic synthesis, so read only the method and factual owners needed by the judgment and answer directly when their returned fields settle it; if several unlabeled handles make the leaf unclear, fetch the carried Project, use its metadata.content_projection.direct_children as the bounded topology index, and follow only the relevant has_children branch until the leaf instead of asking me to repeat context. Once the authority path is clear, read the smallest exact-owner set that can settle a bounded deterministic judgment and answer directly when it supplies every operand; unless I explicitly request only a verdict, state the decisive reusable rule and current operands instead of omitting a retrieved threshold or condition; do not open an answer-only Question before or after those reads merely to restate them. If the answer still requires cross-owner semantic synthesis or typed-source work, use one Corvio synthesis call with exact handles instead of prefetching every sibling. Use search/fetch/read_document for owner discovery and current readback; search.content_complete closes discovery only, so read before an effect that updates that same content-bearing Page, Memory, or Skill when old wording can change the merge; this does not relax exact continuation: read a carried Project when its receipt lacks current body or topology needed for handoff; do not read a Project newly selected by complete search merely to route new material or reconfirm an established archive boundary; never open an answer-only Question as an owner lookup or preview before an allow-actions Question for the same objective. A complete owner receipt contains the binding and all current decision-grade facts, not only a handle. A bound Project plus my unambiguous current update facts is enough to delegate reconciliation; a missing matching leaf, assignee, or old wording does not reopen authority. Carry exact handles for both the chosen owner and any stale, archived, wrong-scope, or non-merge owner that constrains the effect. On MCP, carry Project/Page/Memory/Skill handles in prompt context; workspace_id accepts only a bare Workspace UUID. Preserve any reported truncation boundary. Keep that subject unless I change it. Treat my unambiguous current correction to a Workspace identity, relationship, or owner as authority for that bounded change; preserve prior evidence, and ask only when authority remains unresolved. A read-only fetch proving the named child is already under the requested owner settles only that edge: while the old Project still exists with unclassified branches, pass the natural correction and both Project handles to one Corvio organization operation; accept no-op only from its terminal result and current Tree. First classify future use: if I ask to transform selected material so it supports later action, follow-up, decisions, or review, preserve it and run one Work Model reconciliation without asking again, even when I omit storage words. An ordinary one-off deliverable still needs my explicit request or a user-owned standing preference before writing. If an authorized durable Work Model update relies on related selected attachments, preserve and organize them with the affected owners or topology; do not mutate from excerpts while leaving sources local. If selected Markdown was composed in this Host and any durable owner, topology, Memory, or Skill decision or semantic incorporation remains, pass each remaining selected title and all remaining Markdown content verbatim as inline_materials on ask_corvio allow_actions before any write, after removing only the user-required excluded span and preserving headings, internal blank lines, spaces, and punctuation; only terminal newline normalization is allowed; this remains required when the destination owner is known, because an owner handle is routing evidence and does not turn the body into prompt prose; do not rewrite that source, create a root Page first, or run post-create cleanup. When one coherent future-use outcome combines finalized original Assets with that Host Markdown, attach both asset_ids and inline_materials to the same allow-actions Question so one semantic operation owns the mixed packet; do not run organize_files before or after it. If the Page carrier and owner are decided, use direct create and stop; original files remain Assets. A repeated stable practice requested for future reuse needs a durable owner receipt or an exact canonical no-op readback, not only a chat comparison; a wrong-Project Skill blocks that merge, not admission under the correct Project. Read references/work-model.md before any structural organization or reconciliation. A readback proves only fields it returns. A typed effect field that explicitly returns every required per-owner inclusion/exclusion closes semantic separation when exact wording is not required. Otherwise, if I require adding, preserving, or removing specific statements in an existing owner, or separating named facts between owners, read each affected exact owner once with fetch or read_document after the effect unless the receipt returned its body; never open another Question merely to verify that effect. Merely retaining or connecting selected material and reporting its final location needs no extra body read after a terminal owner/topology/link receipt. A request to keep/connect this material remains general even with specific factual bullets; exact-body acceptance requires explicit verbatim/unchanged, must contain/remove, or must not appear in a named owner wording. Detailed facts, mentioning them in the final response, a new Skill, or Corvio naturally choosing several new owners do not change this boundary. If excluded bytes were removed before dispatch and the accepted source receipt identifies that sanitized input, do not read an output solely to prove they were never sent. Before replying, compare my acceptance wording with the receipt: if I asked to add, preserve, or remove specific content and neither the exact body nor complete typed include/exclude results were returned, read that identified content owner once. A verified terminal owner/topology receipt stays authoritative even when Corvio chooses a title different from my descriptive phrase; do not ask me to recheck or offer another move for that difference alone. A successful user-visible effect is not complete until the final response includes every result's canonical artifact.url or links.primary_artifact exactly as returned. Keep those URL values through any justified post-effect content read; a later owner read without a URL does not erase the earlier link receipt. Return a compact outcome without replaying the operation narrative."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
policy:
  allow_implicit_invocation: true
