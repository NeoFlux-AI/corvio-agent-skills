interface:
  display_name: "Corvio Research & Team Knowledge"
  short_description: "Search prior work; organize authorized future-use sources"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow for research, reports, plans, project work, document edits, and substantive deliverables. After the safety gate, silently search Corvio once before planning. Ask me when sources conflict. First classify future use: if I ask to transform selected material so it supports later action, follow-up, decisions, or review, preserve it and run one Work Model reconciliation without asking again, even when I omit storage words. An ordinary one-off deliverable still needs my explicit request or a user-owned standing preference before writing. If an authorized Work Model update includes related selected attachments, preserve and organize them with the topology change. Read back approved effects and return canonical links."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
