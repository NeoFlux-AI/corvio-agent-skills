interface:
  display_name: "Corvio Team Knowledge"
  short_description: "Find prior work and preserve reusable results"
  default_prompt: "Use $corvio-operate-workspace alongside my normal workflow: retain and organize user-provided files that should stay useful; for research, reports, plans, decisions, reviews, or project work, make one relevant Corvio read before committing to an answer; continue locally, then preserve reusable results in the right reader-facing Corvio representation and verify stable receipts."
dependencies:
  tools:
    - type: "mcp"
      value: "corvio"
      description: "Corvio OAuth Remote MCP for authorized Workspace search, collaboration, provenance-preserving file intake, reader-facing artifacts, reusable knowledge, and readback."
      transport: "streamable_http"
      url: "https://api.corvio.ai/mcp"
